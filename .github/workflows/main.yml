name: Deploy source packages (syspkg)

# On every push to main, repack the changed packages through SourceStream and
# push the resulting source-package tarballs to the syspkg origin over SFTP,
# so a fixed build script is servable immediately afterwards (see the
# diffutils/CDN note in the SplashBuilder AGENTS.md: the cache-busting in
# prepare/dependencies.sh assumes the ORIGIN has the new file).
#
# Required repo secrets:
#   SPLASHOS_SFTP_USER          - SFTP login for iloot.it
#   SPLASHOS_SFTP_PRIVATE_KEY   - OpenSSH private key for that login (public
#                                 half must be in the server's authorized_keys)
# SourceStream's file/push.py authenticates with a private key (set via the
# "keyfile" push.sftp option); password auth remains available as a fallback.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated package names to repack+push (empty = diff of the last push)"
        required: false
        default: ""

concurrency:
  group: deploy-source-packages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        # Full history so the diff against github.event.before always works
        fetch-depth: 0

    - name: Get List of Changed Packages
      id: changed_packages
      env:
        DISPATCH_PACKAGES: ${{ inputs.packages }}
      run: |
        before="${{ github.event.before }}"
        # New branch / first push: the before-sha doesn't exist locally.
        if [ -z "$before" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
          before="HEAD~1"
          echo "No previous commit known, falling back to $before"
        fi

        if [ -n "$DISPATCH_PACKAGES" ]; then
          # Manual dispatch: use the explicitly requested package list
          # (used to re-deploy packages whose automatic run failed, or to
          # force-repack specific packages without a code change).
          packages="$DISPATCH_PACKAGES"
          echo "Manual dispatch, requested packages:$packages"
        else
          # Top-level folders of BuildScripts are the package names; keep only
          # folders that actually contain a manifest.yml (filters out .github,
          # README.md, etc.)
          packages=""
          for pkg in $(git diff --name-only "$before" "$GITHUB_SHA" | awk -F/ '{print $1}' | sort -u); do
            if [ -d "$pkg" ] && find "$pkg" -name manifest.yml | grep -q .; then
              packages="$packages $pkg"
            fi
          done
        fi

        packages="${packages# }"
        echo "Changed packages:${packages:- <none>}"
        echo "packages=$packages" >> "$GITHUB_OUTPUT"

    - name: Set up Python
      if: steps.changed_packages.outputs.packages != ''
      uses: actions/setup-python@v5
      with:
        # SourceStream uses Python 3.12+ f-string syntax (nested same-quote
        # interpolation, PEP 701) throughout; 3.11 fails at import.
        python-version: "3.13"

    - name: Get SourceStream
      if: steps.changed_packages.outputs.packages != ''
      run: |
        git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/MVDW-SplashOS/SourceStream.git

    - name: Install SourceStream dependencies
      if: steps.changed_packages.outputs.packages != ''
      # --require-hashes enforces the hash-pinned lock file (pip verifies every
      # download against requirements-lock.txt); also satisfies Sonar S8544.
      run: pip install --require-hashes '--only-binary=:all:' -r SourceStream/requirements-lock.txt

    - name: Write SFTP private key
      if: steps.changed_packages.outputs.packages != ''
      env:
        SFTP_KEY: ${{ secrets.SPLASHOS_SFTP_PRIVATE_KEY }}
      run: |
        if [ -z "$SFTP_KEY" ]; then
          echo "::error::Secret SPLASHOS_SFTP_PRIVATE_KEY is not set."
          exit 1
        fi
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        printf '%s\n' "$SFTP_KEY" > ~/.ssh/splashos_sftp_key
        chmod 600 ~/.ssh/splashos_sftp_key
        # Fail early (with a clear message) if the stored key is malformed
        if ! ssh-keygen -y -f ~/.ssh/splashos_sftp_key > /dev/null; then
          echo "::error::SPLASHOS_SFTP_PRIVATE_KEY is not a valid OpenSSH private key."
          exit 1
        fi

    - name: Configure SourceStream push target
      if: steps.changed_packages.outputs.packages != ''
      working-directory: SourceStream
      env:
        SFTP_HOST: iloot.it
        SFTP_PORT: 221
        SFTP_USER: ${{ secrets.SPLASHOS_SFTP_USER }}
        SFTP_KEYFILE: /home/runner/.ssh/splashos_sftp_key
        # splashos_git is chrooted to /var/www on the server, so /var/www/... 
        # is seen as /... from the SFTP session.
        SFTP_PATH: /splashos_syspkg/source-packages
      run: |
        python - <<'EOF'
        import os, yaml
        with open("config.yml") as f:
            config = yaml.safe_load(f)
        config["push"] = {
            "type": "sftp",
            "sftp": {
                "host": os.environ["SFTP_HOST"],
                "port": int(os.environ["SFTP_PORT"]),
                "username": os.environ["SFTP_USER"],
                "keyfile": os.environ["SFTP_KEYFILE"],
                "path": os.environ["SFTP_PATH"],
            },
        }
        with open("config.yml", "w") as f:
            yaml.safe_dump(config, f, default_flow_style=False)
        print("push target:", config["push"]["type"],
              config["push"]["sftp"]["host"] + ":" + str(config["push"]["sftp"]["port"]),
              config["push"]["sftp"]["path"], "(key auth)")
        EOF

    - name: Pin SFTP host key
      if: steps.changed_packages.outputs.packages != ''
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        # paramiko's default policy rejects unknown hosts; SourceStream's
        # push.py loads the system known_hosts, so the pin must exist.
        if ! ssh-keyscan -T 15 -p 221 iloot.it >> ~/.ssh/known_hosts; then
          echo "::error::ssh-keyscan could not reach iloot.it:221 from this runner."
          echo "::error::It works from other networks? Then the server firewall is likely"
          echo "::error::blocking GitHub Actions IPs. Allowlist them (dynamic ranges from"
          echo "::error::https://api.github.com/meta -> \"actions\") or open port 221 to all."
          exit 1
        fi

    - name: Repack and push changed packages
      if: steps.changed_packages.outputs.packages != ''
      working-directory: SourceStream
      run: |
        # One run.py invocation per package: SourceStream clones BuildScripts,
        # downloads the upstream source, repacks it with manifest.yml/build/
        # patch/ and SFTPs it to source-packages/<pkg>/<pkg>-<ver>.tar.xz.
        # Per-package invocations isolate failures: one broken package does
        # not block pushing the others, but the job still fails at the end.
        failed=""
        for package in ${{ steps.changed_packages.outputs.packages }}; do
          echo "::group::Repack+push $package"
          if ! python run.py "p:$package"; then
            failed="$failed $package"
          fi
          echo "::endgroup::"
        done

        if [ -n "$failed" ]; then
          echo "::error::Failed to deploy packages:$failed"
          exit 1
        fi
        {
          echo "### Deployed source packages"
          for package in ${{ steps.changed_packages.outputs.packages }}; do
            echo "- \`$package\`"
          done
        } >> "$GITHUB_STEP_SUMMARY"
